<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --lacquer:#0e2a26; --lacquer-2:#143832; --brass:#c19a5b; --brass-lt:#e0c48f; --ivory:#efe9dc;
  --surface:#ffffff; --ink:#14201e; --line:#d9d3c5; --field:#f6f3ec;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Segoe UI",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--surface:#16231f;--ink:#efe9dc;--line:#2c3f39;--field:#0e1a17}
}
:root[data-theme="dark"]{--surface:#16231f;--ink:#efe9dc;--line:#2c3f39;--field:#0e1a17}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--lacquer);font-family:var(--sans);color:var(--ivory);overflow:hidden}

/* App frame */
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#fff}
#frame{width:100%;height:100%;border:0;display:block;background:#fff}

/* Doors */
.door{position:fixed;top:0;bottom:0;width:50%;z-index:20;background:
  linear-gradient(180deg,var(--lacquer-2),var(--lacquer));
  transition:transform 1.3s cubic-bezier(.76,0,.24,1) .15s}
.door.l{left:0;border-right:1px solid var(--brass)}
.door.r{right:0;border-left:1px solid var(--brass)}
.door::before{content:"";position:absolute;inset:7% 8%;border:1px solid rgba(193,154,91,.35)}
.door::after{content:"";position:absolute;top:50%;width:6px;height:90px;border-radius:3px;
  background:linear-gradient(90deg,var(--brass-lt),var(--brass));transform:translateY(-50%)}
.door.l::after{right:18px}.door.r::after{left:18px}
.opened .door.l{transform:translateX(-101%)}
.opened .door.r{transform:translateX(101%)}

/* Plaque */
.plaque{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(360px,86vw);padding:34px 28px 28px;text-align:center;
  background:var(--lacquer);border:1px solid var(--brass);
  box-shadow:0 0 0 6px var(--lacquer),0 0 0 7px rgba(193,154,91,.4);
  transition:opacity .5s ease,transform .5s ease}
.opened .plaque{opacity:0;transform:translate(-50%,-50%) scale(.96);pointer-events:none}
.mono{display:block;width:46px;height:46px;margin:0 auto 14px;border:1px solid var(--brass);border-radius:50%;
  font:600 24px/44px var(--serif);color:var(--brass-lt)}
h1{font:600 30px/1.1 var(--serif);letter-spacing:.02em;color:var(--ivory)}
.sub{margin-top:8px;font-size:13px;font-weight:300;color:rgba(239,233,220,.75)}
.floors{display:flex;justify-content:center;gap:10px;margin:26px 0 14px}
.floors i{width:26px;height:26px;border:1px solid rgba(193,154,91,.4);border-radius:50%;
  font:500 12px/24px var(--sans);font-style:normal;color:rgba(239,233,220,.45);transition:all .35s}
.floors i.on{background:var(--brass);border-color:var(--brass);color:var(--lacquer)}
.bar{height:2px;background:rgba(193,154,91,.25)}
.bar b{display:block;height:100%;width:0;background:var(--brass);transition:width .4s ease}
.status{margin-top:12px;font-size:13px;font-weight:300;min-height:20px;color:rgba(239,233,220,.8)}
.status a{color:var(--brass-lt)}

/* Settings */
.cfg-btn{position:fixed;z-index:40;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:40px;height:40px;border-radius:50%;border:1px solid var(--brass);background:var(--lacquer);
  color:var(--brass-lt);cursor:pointer;font-size:18px;opacity:.85}
.cfg-btn:hover,.cfg-btn:focus-visible{opacity:1;outline:2px solid var(--brass-lt);outline-offset:2px}
.panel{position:fixed;z-index:40;right:14px;bottom:calc(64px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 28px));padding:18px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:none}
.panel.show{display:block}
.panel label{display:block;font-size:13px;font-weight:500;margin:0 0 6px}
.panel input{width:100%;padding:10px 12px;margin-bottom:14px;font:400 14px var(--sans);color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:4px}
.panel input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.row{display:flex;gap:8px}
.btn{flex:1;padding:10px 12px;font:500 14px var(--sans);cursor:pointer;border-radius:4px;
  border:1px solid var(--brass);background:var(--brass);color:#1b1608}
.btn.alt{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{margin-top:12px;font-size:12px;line-height:1.5;opacity:.75}

@media (prefers-reduced-motion:reduce){.door,.plaque,.bar b,.floors i{transition-duration:.01s}}
</style>
</head>
<body>

<div id="app"><iframe id="frame" title="Hotel portal" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe></div>

<div class="door l"></div><div class="door r"></div>

<div class="plaque" role="status" aria-live="polite">
  <span class="mono" id="mono">G</span>
  <h1 id="name">Grey Lodge Hotel</h1>
  <p class="sub">Preparing your stay</p>
  <div class="floors" aria-hidden="true"><i>L</i><i>1</i><i>2</i><i>3</i><i>4</i></div>
  <div class="bar"><b id="bar"></b></div>
  <p class="status" id="status">Opening the lobby…</p>
</div>

<button class="cfg-btn" id="cfgBtn" aria-label="Portal settings" aria-expanded="false">⚙</button>
<div class="panel" id="panel">
  <label for="url">Portal URL</label>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec"
    value="https://script.google.com/macros/s/AKfycbxzvCPU6YI7jV3LEusZFWUg3ta42oP9fg6bgz9kif4pkkKF6uf4jSEHSFqOYYrYZRMitw/exec">
  <label for="hname">Hotel name</label>
  <input id="hname" type="text" value="Grey Lodge Hotel">
  <div class="row">
    <button class="btn" id="load">Load portal</button>
    <button class="btn alt" id="newtab">Open in new tab</button>
  </div>
  <p class="hint">If the portal stays blank, the Apps Script must allow embedding: add <code>.setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)</code> to your HtmlService output, then redeploy.</p>
</div>

<script>
(function(){
  var MIN_MS = 2600, SLOW_MS = 12000;
  var $ = function(id){return document.getElementById(id)};
  var frame=$('frame'), bar=$('bar'), status=$('status'), floors=document.querySelectorAll('.floors i');
  var started, loaded, timer, slowTimer, pct;

  function setProgress(p){
    pct=p; bar.style.width=p+'%';
    var f=Math.min(floors.length, Math.floor(p/20)+(p>=100?0:1));
    floors.forEach(function(el,i){el.classList.toggle('on', i<f)});
  }
  function finish(){
    if(!loaded) return;
    var wait=Math.max(0, MIN_MS-(Date.now()-started));
    setTimeout(function(){
      clearInterval(timer); clearTimeout(slowTimer);
      setProgress(100); status.textContent='Welcome.';
      setTimeout(function(){document.body.classList.add('opened')},450);
    }, wait);
  }
  function start(url){
    document.body.classList.remove('opened');
    loaded=false; started=Date.now(); setProgress(6);
    status.textContent='Opening the lobby…';
    clearInterval(timer); clearTimeout(slowTimer);
    timer=setInterval(function(){
      if(pct<90) setProgress(pct+(90-pct)*0.06+0.4);
      if(pct>35) status.textContent='Preparing your room…';
    },200);
    slowTimer=setTimeout(function(){
      if(loaded) return;
      status.innerHTML='Taking longer than usual. <a href="'+url+'" target="_blank" rel="noopener">Open in a new tab</a>';
    },SLOW_MS);
    frame.onload=function(){loaded=true; finish()};
    frame.src=url;
  }
  function apply(){
    var n=$('hname').value.trim()||'Hotel';
    $('name').textContent=n; $('mono').textContent=n.charAt(0).toUpperCase(); document.title=n;
  }
  function valid(u){try{var x=new URL(u);return x.protocol==='https:'||x.protocol==='http:'}catch(e){return false}}

  $('cfgBtn').onclick=function(){
    var s=$('panel').classList.toggle('show'); this.setAttribute('aria-expanded',s);
  };
  $('load').onclick=function(){
    var u=$('url').value.trim();
    if(!valid(u)){$('url').focus(); $('url').style.borderColor='#b3402f'; return}
    $('url').style.borderColor=''; apply(); $('panel').classList.remove('show'); start(u);
  };
  $('newtab').onclick=function(){var u=$('url').value.trim(); if(valid(u)) window.open(u,'_blank','noopener')};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('panel').classList.remove('show')});

  apply(); start($('url').value.trim());
})();
</script>
</body>
</html>
